<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Adamkhor AI Coding - Professional AI-powered coding assistant for developers">
    <title>AI Chat - Adamkhor AI Coding</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Full-screen chat layout */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .chat-page {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #0a0a0a;
        }

        /* Chat Header */
        .chat-page-header {
            background: rgba(13, 13, 13, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-brand {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .chat-brand h1 {
            font-size: 1.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
        }

        .chat-brand p {
            color: #a0a0a0;
            font-size: 0.9rem;
            margin: 0;
        }

        .back-home {
            padding: 0.6rem 1.2rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #e0e0e0;
            text-decoration: none;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .back-home:hover {
            background: rgba(102, 126, 234, 0.1);
            border-color: #667eea;
        }

        /* Main Chat Container */
        .chat-main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar */
        .chat-sidebar {
            width: 260px;
            background: linear-gradient(145deg, #1a1a1a 0%, #0f0f0f 100%);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            padding: 1rem;
        }

        .sidebar-header {
            margin-bottom: 1rem;
        }

        .new-chat-btn {
            width: 100%;
            padding: 0.8rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .new-chat-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            margin-top: 1rem;
        }

        .history-item {
            padding: 0.8rem;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            margin-bottom: 0.5rem;
            cursor: pointer;
            transition: all 0.3s;
            color: #a0a0a0;
            font-size: 0.9rem;
        }

        .history-item:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: #667eea;
        }

        .sidebar-footer {
            padding-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .clear-history-btn {
            width: 100%;
            padding: 0.6rem;
            background: rgba(255, 77, 77, 0.1);
            border: 1px solid rgba(255, 77, 77, 0.3);
            border-radius: 8px;
            color: #ff4d4d;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .clear-history-btn:hover {
            background: rgba(255, 77, 77, 0.2);
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: radial-gradient(ellipse at top, #1a1a2e 0%, #0a0a0a 50%);
        }

        .chat-messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            scroll-behavior: smooth;
        }

        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            padding: 2rem;
        }

        .welcome-icon {
            font-size: 5rem;
            margin-bottom: 1.5rem;
        }

        .welcome-screen h2 {
            color: #fff;
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .welcome-screen p {
            color: #a0a0a0;
            font-size: 1.2rem;
            max-width: 600px;
        }

        /* Chat Input Area */
        .chat-input-section {
            padding: 1.5rem 2rem;
            background: linear-gradient(145deg, #1a1a1a 0%, #0f0f0f 100%);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .model-selector-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .model-selector-row label {
            color: #a0a0a0;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .model-selector-row select {
            flex: 1;
            max-width: 300px;
            padding: 0.6rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #e0e0e0;
            cursor: pointer;
            transition: all 0.3s;
        }

        .model-selector-row select:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(255, 255, 255, 0.08);
        }

        .input-row {
            display: flex;
            gap: 1rem;
            align-items: flex-end;
        }

        .input-row textarea {
            flex: 1;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #e0e0e0;
            font-family: inherit;
            font-size: 1rem;
            resize: none;
            max-height: 200px;
            transition: all 0.3s;
        }

        .input-row textarea:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(255, 255, 255, 0.08);
        }

        .send-button {
            padding: 1rem 2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .send-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .chat-sidebar {
                position: fixed;
                left: -280px;
                top: 0;
                height: 100vh;
                z-index: 1000;
                transition: left 0.3s;
            }

            .chat-sidebar.active {
                left: 0;
            }

            .chat-page-header {
                padding: 1rem;
            }

            .chat-brand h1 {
                font-size: 1.2rem;
            }

            .chat-brand p {
                display: none;
            }

            .input-row {
                flex-direction: column;
                gap: 0.8rem;
            }

            .send-button {
                width: 100%;
            }

            .welcome-screen h2 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="chat-page">
        <!-- Header -->
        <header class="chat-page-header">
            <div class="chat-brand">
                <div>
                    <h1>Adamkhor AI Coding</h1>
                    <p>Your AI-powered coding assistant</p>
                </div>
            </div>
            <a href="index.html" class="back-home">← Back to Home</a>
        </header>

        <!-- Main Chat Area -->
        <main class="chat-main">
            <!-- Sidebar -->
            <aside class="chat-sidebar">
                <div class="sidebar-header">
                    <button class="new-chat-btn" id="newChatBtnSidebar">+ New Chat</button>
                </div>
                <div class="chat-history" id="chatHistory">
                    <p style="color: #666; text-align: center; padding: 1rem;">No chat history yet</p>
                </div>
                <div class="sidebar-footer">
                    <button class="clear-history-btn" id="clearHistoryBtn">Clear History</button>
                </div>
            </aside>

            <!-- Chat Area -->
            <div class="chat-area">
                <div class="chat-messages-container" id="chatMessagesContainer">
                    <div class="welcome-screen" id="welcomeScreen">
                        <div class="welcome-icon">🤖</div>
                        <h2>Welcome to Adamkhor AI Coding</h2>
                        <p>Your professional AI coding assistant. Ask me anything about programming, debugging, architecture, or best practices.</p>
                    </div>
                </div>

                <!-- Input Section -->
                <div class="chat-input-section">
                    <div class="model-selector-row">
                        <label for="aiModelSelect">AI Model:</label>
                        <select id="aiModelSelect">
                            <option value="claude-sonnet">Claude Sonnet</option>
                            <option value="claude-haiku">Claude Haiku</option>
                            <option value="deepseek">DeepSeek</option>
                            <option value="minimax">MiniMax</option>
                        </select>
                    </div>
                    <div class="input-row">
                        <textarea
                            id="chatInputArea"
                            placeholder="Ask me anything about coding..."
                            rows="1"></textarea>
                        <button id="sendMessageBtn" class="send-button" disabled>Send</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
    <script>
        // ============================================
        // DEDICATED CHAT PAGE FUNCTIONALITY
        // ============================================

        // Chat state
        let chatHistory = [];
        let isAIResponding = false;

        // DOM elements
        const chatMessagesContainer = document.getElementById('chatMessagesContainer');
        const chatInputArea = document.getElementById('chatInputArea');
        const sendMessageBtn = document.getElementById('sendMessageBtn');
        const aiModelSelect = document.getElementById('aiModelSelect');
        const newChatBtnSidebar = document.getElementById('newChatBtnSidebar');
        const clearHistoryBtn = document.getElementById('clearHistoryBtn');
        const welcomeScreen = document.getElementById('welcomeScreen');

        // ============================================
        // API-READY FUNCTION - Future Integration Point
        // ============================================
        async function sendMessageToAI(message, model) {
            /*
             * TODO: Connect to real API endpoint
             *
             * Future implementation:
             * 1. Send request to backend proxy (not direct to AI API)
             * 2. Backend handles API keys securely
             * 3. Backend routes to appropriate model (Claude, DeepSeek, MiniMax)
             * 4. Stream response back to frontend
             * 5. Handle errors and timeouts
             *
             * Example structure:
             * const response = await fetch('/api/chat', {
             *     method: 'POST',
             *     headers: { 'Content-Type': 'application/json' },
             *     body: JSON.stringify({ message, model, history: chatHistory })
             * });
             * return await response.json();
             */

            // For now, use demo response system
            return await generateDemoResponse(message, model);
        }

        // ============================================
        // DEMO RESPONSE GENERATOR
        // ============================================
        async function generateDemoResponse(message, model) {
            // Simulate API delay
            await new Promise(resolve => setTimeout(resolve, 1500 + Math.random() * 1000));

            const lowerMessage = message.toLowerCase();

            // Check for code-related keywords
            const hasCode = lowerMessage.includes('code') || lowerMessage.includes('function') ||
                           lowerMessage.includes('debug') || lowerMessage.includes('error') ||
                           lowerMessage.includes('python') || lowerMessage.includes('javascript');

            let response = '';

            if (hasCode) {
                response = `Great question! Here's how I can help with that:\n\n${getCodeExample(lowerMessage)}\n\nThis approach should work well for your use case. Let me know if you'd like me to explain any part in more detail!`;
            } else {
                response = getDemoTextResponse(lowerMessage, model);
            }

            return { text: response, model: model };
        }

        function getCodeExample(message) {
            if (message.includes('python')) {
                return `\`\`\`python\ndef greet(name):\n    """A simple greeting function"""\n    return f"Hello, {name}!"\n\n# Usage\nresult = greet("Developer")\nprint(result)\n\`\`\``;
            } else if (message.includes('javascript') || message.includes('js')) {
                return `\`\`\`javascript\nfunction fetchData(url) {\n    return fetch(url)\n        .then(response => response.json())\n        .then(data => {\n            console.log('Data received:', data);\n            return data;\n        })\n        .catch(error => console.error('Error:', error));\n}\n\`\`\``;
            } else {
                return `\`\`\`javascript\n// Example implementation\nfunction solution(input) {\n    // Your code here\n    return processedResult;\n}\n\`\`\``;
            }
        }

        function getDemoTextResponse(message, model) {
            const responses = [
                `I'm here to help with your coding questions! As ${model}, I can assist with debugging, architecture decisions, best practices, and more.`,
                `That's an interesting question! Based on my training, I'd recommend considering the trade-offs between performance, maintainability, and scalability.`,
                `Let me break this down for you. The key concepts to understand here are abstraction, encapsulation, and separation of concerns.`,
                `Great question! The best approach depends on your specific requirements, team size, and project timeline. Let's explore the options.`
            ];
            return responses[Math.floor(Math.random() * responses.length)];
        }

        // ============================================
        // MESSAGE RENDERING
        // ============================================
        function addUserMessage(text) {
            if (welcomeScreen) {
                welcomeScreen.style.display = 'none';
            }

            const messageDiv = document.createElement('div');
            messageDiv.className = 'message user';
            messageDiv.innerHTML = `
                <div class="message-content">
                    <div class="message-text">${escapeHtml(text)}</div>
                </div>
                <div class="message-avatar">👤</div>
            `;

            chatMessagesContainer.appendChild(messageDiv);
            scrollToBottom();
        }

        function addAIMessage(text) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ai';

            const content = processMessageContent(text);

            messageDiv.innerHTML = `
                <div class="message-avatar">🤖</div>
                <div class="message-content">
                    ${content}
                    <button class="copy-btn" onclick="copyMessage(this)">Copy</button>
                </div>
            `;

            chatMessagesContainer.appendChild(messageDiv);
            scrollToBottom();
        }

        function processMessageContent(text) {
            // Process code blocks
            const codeBlockRegex = /```(\w+)?\n([\s\S]+?)```/g;
            let processed = text;

            processed = processed.replace(codeBlockRegex, (match, language, code) => {
                const lang = language || 'code';
                return `
                    <div class="code-block">
                        <div class="code-header">
                            <span class="code-language">${lang}</span>
                            <button class="copy-btn" onclick="copyCode(this)">Copy Code</button>
                        </div>
                        <div class="code-content">
                            <pre>${escapeHtml(code.trim())}</pre>
                        </div>
                    </div>
                `;
            });

            // Convert remaining text
            processed = processed.replace(/\n/g, '<br>');

            return `<div class="message-text">${processed}</div>`;
        }

        function showTypingIndicator() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message ai';
            typingDiv.id = 'typingIndicator';
            typingDiv.innerHTML = `
                <div class="message-avatar">🤖</div>
                <div class="typing-indicator">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            `;

            chatMessagesContainer.appendChild(typingDiv);
            scrollToBottom();
        }

        function removeTypingIndicator() {
            const typing = document.getElementById('typingIndicator');
            if (typing) {
                typing.remove();
            }
        }

        // ============================================
        // UTILITY FUNCTIONS
        // ============================================
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function scrollToBottom() {
            chatMessagesContainer.scrollTop = chatMessagesContainer.scrollHeight;
        }

        function copyMessage(button) {
            const messageContent = button.parentElement.querySelector('.message-text');
            const text = messageContent.innerText;

            navigator.clipboard.writeText(text).then(() => {
                button.textContent = 'Copied!';
                setTimeout(() => {
                    button.textContent = 'Copy';
                }, 2000);
            });
        }

        function copyCode(button) {
            const codeBlock = button.closest('.code-block');
            const code = codeBlock.querySelector('pre').innerText;

            navigator.clipboard.writeText(code).then(() => {
                button.textContent = 'Copied!';
                setTimeout(() => {
                    button.textContent = 'Copy Code';
                }, 2000);
            });
        }

        // ============================================
        // EVENT HANDLERS
        // ============================================
        async function handleSendMessage() {
            const message = chatInputArea.value.trim();
            if (!message || isAIResponding) return;

            isAIResponding = true;
            sendMessageBtn.disabled = true;

            // Add user message
            addUserMessage(message);
            chatHistory.push({ role: 'user', content: message });

            // Clear input
            chatInputArea.value = '';
            chatInputArea.style.height = 'auto';
            updateSendButton();

            // Show typing indicator
            showTypingIndicator();

            try {
                // Get AI response
                const selectedModel = aiModelSelect.value;
                const response = await sendMessageToAI(message, selectedModel);

                // Remove typing indicator
                removeTypingIndicator();

                // Add AI message
                addAIMessage(response.text);
                chatHistory.push({ role: 'assistant', content: response.text });

            } catch (error) {
                removeTypingIndicator();
                addAIMessage('Sorry, I encountered an error. Please try again.');
            }

            isAIResponding = false;
            chatInputArea.focus();
        }

        function updateSendButton() {
            sendMessageBtn.disabled = !chatInputArea.value.trim() || isAIResponding;
        }

        function handleNewChat() {
            if (chatHistory.length > 0 && confirm('Start a new chat? This will clear the current conversation.')) {
                clearChat();
            } else if (chatHistory.length === 0) {
                clearChat();
            }
        }

        function handleClearHistory() {
            if (confirm('Clear all chat history? This cannot be undone.')) {
                clearChat();
            }
        }

        function clearChat() {
            chatHistory = [];
            chatMessagesContainer.innerHTML = `
                <div class="welcome-screen" id="welcomeScreen">
                    <div class="welcome-icon">🤖</div>
                    <h2>Welcome to Adamkhor AI Coding</h2>
                    <p>Your professional AI coding assistant. Ask me anything about programming, debugging, architecture, or best practices.</p>
                </div>
            `;
        }

        // ============================================
        // EVENT LISTENERS
        // ============================================
        sendMessageBtn.addEventListener('click', handleSendMessage);

        chatInputArea.addEventListener('input', () => {
            updateSendButton();

            // Auto-resize textarea
            chatInputArea.style.height = 'auto';
            chatInputArea.style.height = Math.min(chatInputArea.scrollHeight, 200) + 'px';
        });

        chatInputArea.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSendMessage();
            }
        });

        newChatBtnSidebar.addEventListener('click', handleNewChat);
        clearHistoryBtn.addEventListener('click', handleClearHistory);

        // Initial state
        updateSendButton();
    </script>
</body>
</html>
